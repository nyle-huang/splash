[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-campaign-pipeline"
version = "0.1.0"
description = "Product-photo-to-campaign generation pipeline with FLUX editing and CTR-aware planning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "OpenAI Codex" },
]
license = { text = "Proprietary" }
keywords = ["product-imagery", "campaigns", "computer-vision", "diffusion"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: Other/Proprietary License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "pillow>=10.4,<12.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0.2,<7.0",
  "structlog>=24.4,<26.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
gpu = [
  "accelerate>=0.34,<1.0",
  "safetensors>=0.4,<1.0",
  "torch>=2.4,<3.0",
  "torchvision>=0.19,<1.0",
]
generation = [
  "diffusers>=0.37,<1.0",
  "transformers>=4.57,<5.0",
]
vision = [
  "opencv-python-headless>=4.10,<5.0",
  "scikit-image>=0.24,<1.0",
]
data = [
  "pandas>=2.2,<3.0",
  "pyarrow>=17.0,<20.0",
]
storage = [
  "fsspec>=2024.6.1,<2027.0",
  "orjson>=3.10,<4.0",
]
service = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn>=0.30,<1.0",
]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
pcp = "product_campaign_pipeline.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
strict = false
